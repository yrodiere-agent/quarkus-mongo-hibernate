name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QUARKUS_BRANCH: mongo-hibernate-spi
  QUARKUS_REPO: yrodiere/quarkus

jobs:
  build-quarkus:
    name: Build Quarkus
    runs-on: ubuntu-latest
    outputs:
      m2-cache-key-month: ${{ steps.cache-key.outputs.m2-cache-key-month }}
    steps:
      - name: Check out Quarkus
        uses: actions/checkout@v4
        with:
          repository: ${{ env.QUARKUS_REPO }}
          ref: ${{ env.QUARKUS_BRANCH }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate cache key
        id: cache-key
        run: |
          CURRENT_MONTH=$(/bin/date -u "+%Y-%m")
          echo "m2-cache-key-month=${CURRENT_MONTH}" >> "$GITHUB_OUTPUT"

      - name: Restore Maven repository cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-cache-quarkus-${{ steps.cache-key.outputs.m2-cache-key-month }}

      - name: Cache Develocity local build cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/.develocity/build-cache
          key: develocity-cache-quarkus-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
          restore-keys: |
            develocity-cache-quarkus-${{ github.event.pull_request.number || github.ref }}-
            develocity-cache-quarkus-

      - name: Build Quarkus
        run: ./mvnw -B install -Dquickly

      - name: Tar Quarkus artifacts for downstream jobs
        run: |
          if [ -d ~/.m2/.develocity/build-cache ]; then
            tar -czf m2-quarkus.tgz -C ~ .m2/repository/io/quarkus .m2/.develocity/build-cache
          else
            tar -czf m2-quarkus.tgz -C ~ .m2/repository/io/quarkus
          fi

      - name: Upload Quarkus artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m2-quarkus
          path: m2-quarkus.tgz
          retention-days: 1

      - name: Delete snapshots from cache
        run: find ~/.m2/repository -name '*-SNAPSHOT' -type d -exec rm -rf {} +

      - name: Save Maven repository cache
        uses: actions/cache/save@v4
        if: github.event_name == 'push'
        with:
          path: ~/.m2/repository
          key: m2-cache-quarkus-${{ steps.cache-key.outputs.m2-cache-key-month }}

  jvm-tests:
    name: JVM Tests
    needs: build-quarkus
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Maven repository cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-cache-quarkus-${{ needs.build-quarkus.outputs.m2-cache-key-month }}

      - name: Download Quarkus artifacts
        uses: actions/download-artifact@v4
        with:
          name: m2-quarkus
          path: .

      - name: Extract Quarkus artifacts
        run: tar -xzf m2-quarkus.tgz -C ~

      - name: Build and test
        run: mvn -B verify -Dtest-containers -Dstart-containers

  native-tests:
    name: Native Tests
    needs: build-quarkus
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - integration-tests/default-pu
          - integration-tests/named-pus
          - integration-tests/quarkus-data
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: 'mandrel-latest'
          java-version: '25'
          distribution: 'mandrel'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Maven repository cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-cache-quarkus-${{ needs.build-quarkus.outputs.m2-cache-key-month }}

      - name: Download Quarkus artifacts
        uses: actions/download-artifact@v4
        with:
          name: m2-quarkus
          path: .

      - name: Extract Quarkus artifacts
        run: tar -xzf m2-quarkus.tgz -C ~

      - name: Build extension
        run: mvn -B install -DskipTests -DskipITs

      - name: Native test - ${{ matrix.module }}
        run: mvn -B verify -f ${{ matrix.module }} -Dnative -Dtest-containers -Dstart-containers
